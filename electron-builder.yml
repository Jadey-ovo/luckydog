appId: com.aimall.luckydog
productName: Luckydog
copyright: Copyright © 2026 Aimall
asar: true
compression: maximum
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  title: Luckydog 抽奖助手
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Luckydog 抽奖助手
  deleteAppDataOnUninstall: false
